[tools]
node = "22.14.0"

[tasks.setup]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Run the Vite development shell"
run = "npm run dev"

[tasks.build]
description = "Build the distributable package"
run = "npm run build"

[tasks.check]
description = "Run formatting, lint, type, and test checks"
run = "npm run check"

[tasks.test]
description = "Run the Vitest suite"
run = "npm run test"

[tasks.catalog]
description = "Run the catalog development entry point"
run = "npm run catalog"

[tasks.docs]
description = "Run the phase 1 documentation placeholder"
run = "npm run docs"
