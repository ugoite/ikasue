name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install package dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Ikasue identity acceptance tests
        run: npm run test:ui -- tests/ikasue-identity.spec.ts --workers=1 --timeout=30000
      - name: Install documentation dependencies
        run: npm ci --prefix docs-site
      - name: Check formatting and package
        run: npm run check
      - name: Build package
        run: npm run build
      - name: Check documentation
        env:
          DOCS_SYNC_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DOCS_SYNC_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: npm run docs:check
      - name: Build documentation
        run: npm run docs:build
